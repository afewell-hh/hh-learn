# argo-cd chart values (version supplied via HOTLAB_ARGOCD_CHART_VERSION).
# U: key names not verified against a specific chart version; confirm at first operator run.
# The initial admin secret is generated by the chart; read it with:
#   kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d
configs:
  params:
    server.insecure: true        # TLS terminates outside; plain HTTP behind the k3d LB
server:
  service:
    type: NodePort
    nodePortHttp: 30080
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
