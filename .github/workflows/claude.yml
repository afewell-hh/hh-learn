name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      # contents/pull-requests elevated to write so dispatched agents can create
      # a branch and open a PR, which several Hot Lab tickets (#497) require.
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Tool allowlist. Dispatched agents were previously unable to read
          # sibling issues (`gh issue view` denied), fetch upstream source, or
          # clone public Hedgehog repos -- so they worked blind from the ticket
          # body alone. The list below is deliberately COMPREHENSIVE rather than
          # additive-only, because it is not documented whether --allowed-tools
          # extends or replaces the default set; listing the core tools makes the
          # behaviour correct either way.
          claude_args: >-
            --allowed-tools
            Read,Write,Edit,Glob,Grep,NotebookEdit,TodoWrite,WebFetch,WebSearch,Bash

