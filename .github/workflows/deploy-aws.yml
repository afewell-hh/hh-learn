name: Deploy AWS
#
# DISPATCH-ONLY BY DESIGN. Do not re-add a `push` trigger without reading this.
#
# This workflow previously ran on every push to main and on v* tags. On those
# events there are no `workflow_dispatch` inputs, so `APP_STAGE` resolved to the
# empty string, and serverless.yml:26 (`stage: ${env:APP_STAGE, 'dev'}`) therefore
# defaulted the deployment to the **dev** stage. Issue #460 documented that the
# bare `api.hedgehog.cloud` root mapping pointed at `dev-hedgehog-learn`, so an
# unattended push-triggered deploy could affect the live production API.
#
# In practice every push-triggered run had failed since 2026-04-09 (variable
# resolution error on HUBDB_MODULES_TABLE_ID), so the breakage was acting as an
# accidental safety brake while ~7 months of Lambda changes accumulated on main.
# Supplying that variable would have converted a harmless failure into an
# unreviewed deploy of all that drift, at an unintended stage.
#
# Deployments are performed deliberately, with an explicit stage, via
# `APP_STAGE=<stage> npm run deploy:aws` or a manual dispatch of this workflow.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Serverless stage (e.g., dev, staging, prod)"
        required: true
        default: "dev"
      region:
        description: "AWS region (e.g., us-west-2, or leave empty to use AWS_REGION secret)"
        required: false
      enable_crm_progress:
        description: "Enable authenticated CRM progress tracking"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - name: Require an explicit stage
        env:
          STAGE: ${{ github.event.inputs.stage }}
        run: |
          set -euo pipefail
          if [ -z "${STAGE}" ]; then
            echo "::error::APP_STAGE is empty. serverless.yml defaults an empty stage to 'dev',"
            echo "::error::and the bare api.hedgehog.cloud mapping has historically pointed there."
            echo "::error::Dispatch this workflow with an explicit stage instead."
            exit 1
          fi
          echo "Deploying to stage: ${STAGE}"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build

      # Package and verify size before deploying
      - name: Package Lambda
        run: npx serverless package
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          HUBSPOT_ACCOUNT_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_REGION: ${{ github.event.inputs.region || secrets.AWS_REGION }}
          APP_STAGE: ${{ github.event.inputs.stage }}
          ENABLE_CRM_PROGRESS: ${{ github.event.inputs.enable_crm_progress == 'true' && 'true' || secrets.ENABLE_CRM_PROGRESS || 'false' }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
          COGNITO_REDIRECT_URI: ${{ secrets.COGNITO_REDIRECT_URI }}
          COGNITO_ISSUER: ${{ secrets.COGNITO_ISSUER }}

      - name: Verify package size
        run: |
          echo "=== Package Size Check ==="

          # Check zipped size
          ZIPPED_SIZE=$(du -b .serverless/api.zip | cut -f1)
          ZIPPED_MB=$(echo "scale=2; $ZIPPED_SIZE / 1024 / 1024" | bc)
          echo "Zipped size: ${ZIPPED_MB} MB"

          # Check unzipped size
          UNZIPPED_SIZE=$(unzip -l .serverless/api.zip | tail -n 1 | awk '{print $1}')
          UNZIPPED_MB=$(echo "scale=2; $UNZIPPED_SIZE / 1024 / 1024" | bc)
          echo "Unzipped size: ${UNZIPPED_MB} MB"

          # Count files
          FILE_COUNT=$(unzip -l .serverless/api.zip | tail -n 1 | awk '{print $2}')
          echo "File count: ${FILE_COUNT}"

          # Check for unwanted files
          echo ""
          echo "=== Checking for unwanted files ==="
          UNWANTED=$(unzip -l .serverless/api.zip | grep -E "(dist/src|eslint\.config\.js|scratch\.txt|\.package-lock\.json)" || echo "None found")
          if [ "$UNWANTED" != "None found" ]; then
            echo "WARNING: Found unwanted files in package:"
            echo "$UNWANTED"
          else
            echo "✓ No unwanted files detected"
          fi

          # Fail if size exceeds limits
          if (( $(echo "$ZIPPED_SIZE > 52428800" | bc -l) )); then
            echo "ERROR: Zipped size exceeds 50 MB limit"
            exit 1
          fi

          if (( $(echo "$UNZIPPED_SIZE > 262144000" | bc -l) )); then
            echo "ERROR: Unzipped size exceeds 250 MB AWS limit"
            exit 1
          fi

          echo ""
          echo "✓ Package size checks passed"

      - name: Verify deployment configuration
        run: |
          echo "=== Deployment Configuration ==="
          npx serverless print --stage ${{ github.event.inputs.stage }} --region ${{ github.event.inputs.region || secrets.AWS_REGION }} | grep -E "(region|stage|runtime)" || true

      - name: Deploy to AWS
        run: npm run deploy:aws
        env:
          # Prefer Project App token; fall back to Private App during migration
          HUBSPOT_PROJECT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_PROJECT_ACCESS_TOKEN }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          HUBSPOT_ACCOUNT_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_REGION: ${{ github.event.inputs.region || secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_STAGE: ${{ github.event.inputs.stage }}
          ENABLE_CRM_PROGRESS: ${{ github.event.inputs.enable_crm_progress == 'true' && 'true' || secrets.ENABLE_CRM_PROGRESS || 'false' }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
          COGNITO_REDIRECT_URI: ${{ secrets.COGNITO_REDIRECT_URI }}
          COGNITO_ISSUER: ${{ secrets.COGNITO_ISSUER }}
