name: Auto Code Review (Copilot)

# Requests GitHub Copilot code review on every new PR.
#
# Requires Copilot code review to be enabled for this repository
# (Settings -> Copilot, or github.com/settings/copilot for a personal repo).
# Copilot code review does NOT expose model selection; thoroughness is controlled
# by review effort level (Lite / Balanced / Max), configured in those settings.
#
# If Copilot is not enabled or not licensed, this job fails soft and logs a notice
# rather than blocking the PR.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot as reviewer
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # "Copilot" is the reviewer login the REST API accepts.
          # Note: if Copilot code review is not enabled/licensed for the repo,
          # the API returns 200 and silently adds no reviewer -- so we verify.
          echo '{"reviewers":["Copilot"]}' \
            | gh api -X POST "/repos/$REPO/pulls/$PR/requested_reviewers" --input - >/dev/null || true

          if gh api "/repos/$REPO/pulls/$PR/requested_reviewers" \
               --jq '[.users[].login] | index("Copilot")' | grep -qv '^$'; then
            echo "::notice::Copilot code review requested on PR #$PR"
          else
            echo "::warning::Copilot was not added as a reviewer on PR #$PR. \
            Enable Copilot code review for $REPO (Settings -> Copilot) and confirm the account is licensed."
          fi
