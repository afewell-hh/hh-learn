# Servers and server-facing Connections. Each connection is an Unbundled single link and carries topology.fabric
# of the SWITCH it lands on (connection_types.go:896 requires connection fabric == switch fabric).
# A Server object has no fabric field; the SAME server name appears in Connections of three different Fabrics.
# Whether that is accepted/behaves coherently is UNPROVEN (README assumption U1) -- connection_types.go:957 only
# checks that the server exists.
#
# GPU server NIC map (VLAB names; data NICs start at enp2s1, enp2s0 is management):
#   enp2s1,enp2s2   frontend  -> fe-leaf-01, fe-leaf-02
#   enp2s3..enp2s6  backend plane-a rails 0..3 -> be-a-leaf-01, be-a-leaf-02, be-a-leaf-01, be-a-leaf-02
#   enp2s7..enp2s10 backend plane-b rails 4..7 -> be-b-leaf-01, be-b-leaf-02, be-b-leaf-01, be-b-leaf-02
#   enp2s11,enp2s12 storage   -> st-leaf-01, st-leaf-02
# Switch ports for gpu-0N: fe-leaf E1/N ; be leaf E1/(2N-1) and E1/(2N) ; st-leaf E1/N.
# svc-01: fe E1/9 (enp2s1,s2), st E1/9 (enp2s3,s4).  svc-02: fe E1/10 (enp2s1,s2).
---
apiVersion: wiring.githedgehog.com/v1beta1
kind: Server
metadata: {name: gpu-01, namespace: default}
spec: {description: "GPU server 1 (B200-class model, 12 data NICs)"}
---
