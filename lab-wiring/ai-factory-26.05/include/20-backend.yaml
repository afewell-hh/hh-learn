# Fabric "backend": two spine layers (domains plane-a, plane-b), 2 leaves per plane, 1 spine per plane.
# Boot MACs 0c:20:12:ff:04..09:00. A spine is in exactly one domain (switch_types.go:559); each leaf here is
# in exactly one domain (it uplinks to one plane only). Planes meet only at the servers.
---
apiVersion: wiring.githedgehog.com/v1beta1
kind: Switch
metadata: {name: be-a-spine-01, namespace: default}
spec:
  role: spine
  description: "backend plane-a spine"
  profile: vs
  topology: {fabric: backend, domains: [plane-a]}
  vlanNamespaces: [backend]
  boot: {mac: "0c:20:12:ff:04:00"}
---
apiVersion: wiring.githedgehog.com/v1beta1
kind: Switch
metadata: {name: be-a-leaf-01, namespace: default}
spec:
  role: server-leaf
  description: "backend plane-a leaf 1 (rails 0,2)"
  profile: vs
  topology: {fabric: backend, domains: [plane-a]}
  vlanNamespaces: [backend]
  boot: {mac: "0c:20:12:ff:05:00"}
---
apiVersion: wiring.githedgehog.com/v1beta1
kind: Switch
metadata: {name: be-a-leaf-02, namespace: default}
spec:
  role: server-leaf
  description: "backend plane-a leaf 2 (rails 1,3)"
  profile: vs
  topology: {fabric: backend, domains: [plane-a]}
  vlanNamespaces: [backend]
  boot: {mac: "0c:20:12:ff:06:00"}
---
apiVersion: wiring.githedgehog.com/v1beta1
kind: Switch
metadata: {name: be-b-spine-01, namespace: default}
spec:
  role: spine
  description: "backend plane-b spine"
  profile: vs
  topology: {fabric: backend, domains: [plane-b]}
  vlanNamespaces: [backend]
  boot: {mac: "0c:20:12:ff:07:00"}
---
apiVersion: wiring.githedgehog.com/v1beta1
kind: Switch
metadata: {name: be-b-leaf-01, namespace: default}
spec:
  role: server-leaf
  description: "backend plane-b leaf 1 (rails 4,6)"
  profile: vs
  topology: {fabric: backend, domains: [plane-b]}
  vlanNamespaces: [backend]
  boot: {mac: "0c:20:12:ff:08:00"}
---
apiVersion: wiring.githedgehog.com/v1beta1
kind: Switch
metadata: {name: be-b-leaf-02, namespace: default}
spec:
  role: server-leaf
  description: "backend plane-b leaf 2 (rails 5,7)"
  profile: vs
  topology: {fabric: backend, domains: [plane-b]}
  vlanNamespaces: [backend]
  boot: {mac: "0c:20:12:ff:09:00"}
---
apiVersion: wiring.githedgehog.com/v1beta1
kind: Connection
metadata: {name: be-a-spine-01--fabric--be-a-leaf-01, namespace: default}
spec:
  topology: {fabric: backend}
  fabric:
    links:
      - {spine: {port: be-a-spine-01/E1/1}, leaf: {port: be-a-leaf-01/E1/17}}
      - {spine: {port: be-a-spine-01/E1/2}, leaf: {port: be-a-leaf-01/E1/18}}
---
apiVersion: wiring.githedgehog.com/v1beta1
kind: Connection
metadata: {name: be-a-spine-01--fabric--be-a-leaf-02, namespace: default}
spec:
  topology: {fabric: backend}
  fabric:
    links:
      - {spine: {port: be-a-spine-01/E1/3}, leaf: {port: be-a-leaf-02/E1/17}}
      - {spine: {port: be-a-spine-01/E1/4}, leaf: {port: be-a-leaf-02/E1/18}}
---
apiVersion: wiring.githedgehog.com/v1beta1
kind: Connection
metadata: {name: be-b-spine-01--fabric--be-b-leaf-01, namespace: default}
spec:
  topology: {fabric: backend}
  fabric:
    links:
      - {spine: {port: be-b-spine-01/E1/1}, leaf: {port: be-b-leaf-01/E1/17}}
      - {spine: {port: be-b-spine-01/E1/2}, leaf: {port: be-b-leaf-01/E1/18}}
---
apiVersion: wiring.githedgehog.com/v1beta1
kind: Connection
metadata: {name: be-b-spine-01--fabric--be-b-leaf-02, namespace: default}
spec:
  topology: {fabric: backend}
  fabric:
    links:
      - {spine: {port: be-b-spine-01/E1/3}, leaf: {port: be-b-leaf-02/E1/17}}
      - {spine: {port: be-b-spine-01/E1/4}, leaf: {port: be-b-leaf-02/E1/18}}
