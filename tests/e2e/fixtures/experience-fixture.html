<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabric Operator (RED fixture)</title>
  <!-- Player CSS/JS are the committed browser assets generated from src/experiences/*.
       They do not exist yet in RED, so the player never initializes and the
       behavioural assertions fail. -->
  <link rel="stylesheet" href="../../../clean-x-hedgehog-templates/assets/css/experience-player.css">

  <!-- Inline scenario island. In production this is produced by serializeIsland()
       at publish time (adversarial-escaping correctness is covered by the jest unit
       test tests/unit/experience-serialize-island.test.ts). This fixture keeps the
       island clean; the e2e asserts it is parsed (never fetched) and that exactly
       one non-executable application/json island exists. -->
  <script type="application/json" id="hhl-exp-scenario">
{"scenarioId":"fabric-operator","version":"1","title":"Operate a Hedgehog fabric","summary":"fixture","honestyLabel":"Guided replay of a real validated workflow — not a live fabric.","continuity":"composite","leadBridge":{"primary":{"label":"Launch the full Virtual Lab","href":"/vlab"},"secondary":[{"label":"Talk to us","href":"/contact"}]},"entities":{"switches":[{"id":"leaf-01","role":"leaf","ports":["E1/1"]}],"servers":[{"id":"server-01"}],"vpcs":[{"id":"webapp-prod","vlans":[1010,1020]}]},"acts":[{"id":"provision","title":"Provision a VPC","primaryEntities":["webapp-prod"],"steps":[{"id":"apply-vpc","kind":"command","narrative":"Provisioning a VPC is a single declarative apply.","command":"kubectl apply -f webapp-prod-vpc.yaml","output":{"mode":"static","text":"vpc.vpc.githedgehog.com/webapp-prod created","format":"text"}},{"id":"get-vpcs","kind":"command","narrative":"List the VPCs.","command":"kubectl get vpcs","output":{"mode":"static","text":"NAME          AGE\nwebapp-prod   5s","format":"table"}}]}]}

</head>
<body>
  <div data-hhl-experience
       data-flag-enabled="true"
       data-scenario-el="hhl-exp-scenario"

       data-cta-secondary-json='[{"label":"Talk to us","url":"/contact"},{"label":"Continue learning","url":"/learn"}]'>

  <script src="../../../clean-x-hedgehog-templates/assets/js/experience-player.js" defer></script>
</body>
</html>
