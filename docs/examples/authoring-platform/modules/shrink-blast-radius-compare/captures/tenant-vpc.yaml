apiVersion: vpc.githedgehog.com/v1beta1
kind: VPC
metadata:
  name: tenant-a
  namespace: default
spec:
  ipv4Namespace: default
  vlanNamespace: default
  subnets:
    default:
      subnet: 10.0.10.0/24
      gateway: 10.0.10.1
      vlan: 1010
      dhcp:
        enable: true
        range:
          start: 10.0.10.10
          end: 10.0.10.99
---
apiVersion: vpc.githedgehog.com/v1beta1
kind: VPCAttachment
metadata:
  name: tenant-a-server-01
  namespace: default
spec:
  connection: server-01--unbundled--leaf-01
  subnet: tenant-a/default
