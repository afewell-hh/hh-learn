# STAGING COPY. Install as .github/workflows/hotlab-vm-reaper.yml (see RUNBOOK.md).
# It is staged under docs/ because the automation that authored it cannot write to
# .github/workflows. The installed path is part of the WIF trust boundary.
name: Hot Lab VM (reaper)

# Independent expiry sweeper (#508). Own schedule, own WIF pool
# (`hotlab-reaper`), own SA (`hotlab-vm-reaper`). It does NOT depend on the
# creator workflow and its SA holds NO create permission.
#
# Provider attribute condition pins:
#   repository_id       == 1046667618
#   repository_owner_id == 193945001
#   ref                 == refs/heads/main
#   workflow_ref        == afewell-hh/hh-learn/.github/workflows/hotlab-vm-reaper.yml@refs/heads/main
#   event_name          in ['schedule', 'workflow_dispatch']
#
# SCOPE: only instances whose NAME starts with `hotlab-` are ever considered, and
# the SA's delete permission is additionally IAM-conditioned to that prefix. The
# project is shared with unrelated workloads (e.g. Labapp), so "delete everything
# unlabelled" would be destructive; "unlabelled hotlab-*" is the orphan definition.
#
# An instance is deleted when ANY holds:
#   - a required label is missing / managed-by != hotlab
#   - created-at / expires-at are not integers
#   - now >= expires-at
#   - expires-at - created-at exceeds the lifetime cap (tampered / overlong)
#   - zone or machine type is outside the allowlist
#   - it is beyond MAX_CONCURRENT (newest are deleted first)
#
# The job FAILS (red, emails watchers) if any violating instance still exists after
# the sweep, or if a list/delete call errors. A green run therefore means "listed
# successfully and nothing violating remains", not "nothing went wrong".
#
# KNOWN LIMITS: GitHub `schedule` is best-effort (delays/drops under load) and
# GitHub disables scheduled workflows after 60 days without repo activity. That is
# why --max-run-duration on the instance is the real backstop; this is layer 4.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only; delete nothing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: hotlab-vm-reaper
  cancel-in-progress: false

env:
  PROJECT: ${{ vars.HOTLAB_GCP_PROJECT }}
  # Reaper-owned copies of the caps (intentionally independent of the creator).
  MAX_CONCURRENT: "2"
  MAX_LIFETIME_S: "29400"   # 480 min + 10 min slack
  ALLOWED_ZONES: "us-west4-a,us-west4-b,us-west4-c"
  ALLOWED_MACHINES: "n1-standard-8,n1-highmem-4,n1-standard-16"

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authenticate to Google Cloud via WIF (reaper pool)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.HOTLAB_REAPER_WIF_PROVIDER }}
          service_account: ${{ vars.HOTLAB_REAPER_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.HOTLAB_GCP_PROJECT }}

      - name: Confirm federated identity
        run: |
          set -euo pipefail
          echo "### Federated identity" >> "$GITHUB_STEP_SUMMARY"
          gcloud auth list --format="value(account)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sweep
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}   # scheduled runs have no inputs => live
        run: |
          set -euo pipefail
          now="$(date +%s)"
          echo "### Reaper sweep (now=${now}, dry_run=${DRY_RUN})" >> "$GITHUB_STEP_SUMMARY"

          list() { gcloud compute instances list --project="$PROJECT" --filter="name~'^hotlab-'" --format=json; }
          list > all.json     # a list error aborts the run (set -e): never read as "empty"
          jq -e 'type=="array"' all.json >/dev/null

          # Pass 1: per-instance rule violations.
          jq -r --arg now "$now" --arg ml "$MAX_LIFETIME_S" --arg zones "$ALLOWED_ZONES" --arg machines "$ALLOWED_MACHINES" '
            ($now|tonumber) as $now | ($ml|tonumber) as $ml |
            .[] | . as $i
            | ($i.labels // {}) as $l
            | ($i.zone|split("/")|last) as $z
            | ($i.machineType|split("/")|last) as $mt
            | (["managed-by","owner","ticket","run-id","created-at","expires-at"] | map(select($l[.] == null))) as $missing
            | (if ($missing|length) > 0 then "missing-labels:" + ($missing|join(","))
               elif $l["managed-by"] != "hotlab" then "managed-by-not-hotlab"
               elif (($l["created-at"]|test("^[0-9]+$"))|not) or (($l["expires-at"]|test("^[0-9]+$"))|not) then "malformed-timestamps"
               elif ($l["expires-at"]|tonumber) <= $now then "expired"
               elif (($l["expires-at"]|tonumber) - ($l["created-at"]|tonumber)) > $ml then "lifetime-exceeds-cap"
               elif (($z | IN($zones|split(",")[])) | not) then "zone-not-allowed"
               elif (($mt | IN($machines|split(",")[])) | not) then "machine-type-not-allowed"
               else empty end) as $reason
            | [$i.name, $z, $reason] | @tsv' all.json > violators.tsv

          # Pass 2: over-concurrency among the survivors (keep oldest, delete newest).
          viol_json="$(cut -f1 violators.tsv | jq -R . | jq -s .)"
          jq -r --argjson viol "$viol_json" --argjson max "$MAX_CONCURRENT" '
            map(select(.name as $n | (any($viol[]; . == $n)) | not))
            | sort_by(.creationTimestamp) | .[$max:] | .[]
            | [.name, (.zone|split("/")|last), "over-concurrency-cap"] | @tsv' all.json >> violators.tsv

          total="$(jq 'length' all.json)"
          nviol="$(wc -l < violators.tsv)"
          echo "hotlab-* instances: ${total}; violating: ${nviol}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$nviol" -gt 0 ]; then
            { echo ""; echo '| instance | zone | reason |'; echo '|---|---|---|'; \
              awk -F'\t' '{print "| "$1" | "$2" | "$3" |"}' violators.tsv; } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing deleted." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          errors=0
          while IFS=$'\t' read -r name zone reason; do
            [ -n "$name" ] || continue
            echo "Deleting ${name} (${zone}): ${reason}"
            if ! gcloud compute instances delete "$name" --zone "$zone" --project "$PROJECT" --quiet; then
              echo "::error::delete failed for ${name}"; errors=$((errors+1))
            fi
          done < violators.tsv

          # Positive confirmation: re-list and require every violator to be gone.
          list > after.json
          remaining="$(jq -r --argjson viol "$(cut -f1 violators.tsv | jq -R . | jq -s .)" \
            '[.[] | select(.name as $n | any($viol[]; . == $n)) | .name] | join(",")' after.json)"
          if [ -n "$remaining" ] || [ "$errors" -ne 0 ]; then
            echo "::error::Reaper could not clear: '${remaining}' (delete errors: ${errors})"
            exit 1
          fi
          echo "Sweep complete; all violators confirmed absent." | tee -a "$GITHUB_STEP_SUMMARY"
